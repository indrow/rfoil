[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rfoil"
description = "Viscous/inviscid airfoil analysis: Rust solver with a Qt user interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Indra Wibisono", email = "indrawibisono@duck.com" }]
dependencies = ["numpy>=1.26", "PySide6>=6.7", "pyqtgraph>=0.13.7"]
dynamic = ["version"]

[project.scripts]
rfoil = "rfoil.gui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
manifest-path = "crates/rfoil-py/Cargo.toml"
python-source = "python"
module-name = "rfoil._core"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# sources live on a filesystem without POSIX permissions
extend-ignore = ["EXE002"]
